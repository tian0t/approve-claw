name: WatchApprove
options:
  bundleIdPrefix: com.yu.clawapp
  developmentKeysByDefault: true

targets:
  WatchApprove:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ios/WatchApprove
      - path: ios/Shared
    dependencies:
      - target: WatchApproveWatch
        embed: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.yu.clawapp.WatchApprove
      INFOPLIST_FILE: ios/WatchApprove/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      TARGETED_DEVICE_FAMILY: "1"
      CODE_SIGN_STYLE: Automatic
      
  WatchApproveWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: ios/WatchApproveWatch
      - path: ios/Shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.yu.clawapp.WatchApprove.watchkitapp
      INFOPLIST_FILE: ios/WatchApproveWatch/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      GENERATE_INFOPLIST_FILE: YES
      SDKROOT: watchos
      CODE_SIGN_STYLE: Automatic
