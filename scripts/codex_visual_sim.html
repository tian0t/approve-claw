<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OpenAI Codex — Approval Required</title>
  <style>
    :root { color-scheme: dark; font: 16px -apple-system, BlinkMacSystemFont, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #16181d; color: #f5f7fa; }
    main { width: 680px; padding: 32px; border: 1px solid #3a3f49; border-radius: 18px; background: #23262d; box-shadow: 0 24px 70px #0008; }
    .eyebrow { color: #8ab4ff; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 12px 0 8px; font-size: 30px; }
    p { color: #c6cbd4; }
    pre { padding: 16px; border-radius: 10px; background: #111318; color: #d8e1f0; }
    .actions { display: flex; gap: 14px; margin-top: 26px; }
    button { border: 0; border-radius: 10px; padding: 14px 24px; font-size: 17px; font-weight: 700; cursor: pointer; }
    #approve { background: #2f9e68; color: white; }
    #reject { background: #8e3440; color: white; }
    #result { margin-top: 22px; min-height: 22px; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">OpenAI Codex</div>
    <h1>Codex Approval Required</h1>
    <p>Codex wants to execute the following command.</p>
    <pre>echo Vision coordinate simulation</pre>
    <div class="actions">
      <button id="approve">Approve</button>
      <button id="reject">Reject</button>
    </div>
    <div id="result" aria-live="polite"></div>
  </main>
  <script>
    document.querySelector('#approve').onclick = () => document.querySelector('#result').textContent = 'Approved locally';
    document.querySelector('#reject').onclick = () => document.querySelector('#result').textContent = 'Rejected locally';
  </script>
</body>
</html>
